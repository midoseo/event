<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- [공유 시 제목] -->
    <title>에스원 이벤트</title>

    <!-- [Open Graph 설정: 카카오톡 리치 링크용] -->
    <meta property="og:type" content="website">
    <!-- 본인의 깃허브 주소로 수정하세요 -->
    <meta property="og:url" content="https://midoseo.github.io/event/"> 
    <!-- 카카오톡 제목 (굵은 글씨) -->
    <meta property="og:title" content="에스원 이벤트 제목">
    <!-- 카카오톡 설명 (작은 글씨) -->
    <meta property="og:description" content="에스원 이벤트 설명">
    <!-- 이미지 경로: 반드시 '전체 URL 주소'로 작성하세요 -->
    <meta property="og:image" content="https://계정명.github.io/레포지토리명/og-image.jpg">
    
    <!-- 이미지가 크게 나오게 하기 위한 필수 권장 사이즈 -->
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <style>
        /* 웹페이지 디자인 (선택사항) */
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .container {
            text-align: center;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>


</body>
</html>
